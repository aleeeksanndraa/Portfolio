<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>posters — aleksandra slahova</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .pg-wrap { padding: 130px clamp(20px, 3.5vw, 56px) clamp(56px, 8vw, 110px); }
  .pg-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px 28px;
    border-bottom: 1px solid var(--line); padding-bottom: 22px; margin-bottom: clamp(24px, 3vw, 40px);
  }
  .pg-head h1 {
    font-family: var(--display); font-weight: 900; text-transform: lowercase;
    letter-spacing: -0.04em; line-height: 0.9; font-size: clamp(44px, 8vw, 120px); color: var(--accent);
  }
  .pg-head .serif-note { font-family: var(--serif); font-style: italic; font-size: clamp(20px, 2.4vw, 38px); color: var(--ink); }
  .pg-head .label { margin-left: auto; }
  .pg-count { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: clamp(20px,2.6vw,32px); }
  /* precise, evenly-aligned grid — uniform portrait tiles */
  .pg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 18vw, 230px), 1fr));
    gap: clamp(10px, 1.4vw, 20px);
  }
  .pg-cell {
    margin: 0; aspect-ratio: 3 / 4; overflow: hidden;
    background: var(--bg-2); border: 1px solid var(--line); display: block;
  }
  .pg-cell img, .pg-cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pg-back { display: inline-block; margin-top: clamp(40px,6vw,80px); }
</style>
</head>
<body data-screen-label="posters">

<nav class="nav">
  <a class="nav-logo" href="index.html"><img src="assets/logo-on-dark.svg" alt="aleksandra slahova — logo"></a>
  <div class="nav-links">
    <a href="work.html">work</a>
    <a href="about.html">about</a>
    <a href="index.html#contact">contact</a>
  </div>
  <div class="nav-meta">amsterdam, nl — 52.37°n</div>
<button class="nav-burger" type="button" aria-label="menu" aria-expanded="false"><span></span><span></span><span></span></button>
</nav>

<main class="pg-wrap">
  <header class="pg-head" data-reveal>
    <h1>posters</h1>
    <span class="serif-note">event visuals &amp; campaign design</span>
    <span class="label">visual archive — 01</span>
  </header>
  <p class="pg-count" data-reveal id="pg-count"></p>
  <div class="pg-grid" id="pg-grid" data-reveal></div>
  <a href="work-visual-archive.html" class="label pg-back" style="border-bottom:1px solid var(--line);padding-bottom:3px">← back to visual archive</a>
</main>

<div class="grain"></div>
<script src="shared.js"></script>
<script>
/* Renders the posters exactly as arranged in the visual-archive marquee.
   Reads the saved arrangement (localStorage 'posters-order-v1') when present —
   this matches the live view tile-for-tile, including any image dropped in.
   Falls back to the baked default order below otherwise. */
(function(){
  var DEFAULT = [
    {kind:'video', src:'assets/posters/denji.mp4'},
    {kind:'img',   src:'assets/posters/poster-01.jpg', alt:'poster 1'},
    {kind:'video', src:'assets/posters/motion-05.mp4'},
    {kind:'img',   src:'assets/posters/poster-08.jpg', alt:'poster 8'},
    {kind:'img',   src:'assets/posters/poster-09.jpg', alt:'poster 9'},
    {kind:'img',   src:'assets/posters/poster-11.jpg', alt:'poster 11'},
    {kind:'video', src:'assets/posters/motion-09.mp4'},
    {kind:'img',   src:'assets/posters/poster-10.jpg', alt:'poster 10'},
    {kind:'img',   src:'assets/posters/poster-14.jpg', alt:'poster 14'},
    {kind:'video', src:'assets/posters/motion-12.mp4'},
    {kind:'video', src:'assets/posters/motion-08.mp4'},
    {kind:'img',   src:'assets/posters/poster-16.jpg', alt:'poster 16'},
    {kind:'video', src:'assets/posters/motion-10.mp4'},
    {kind:'img',   src:'assets/posters/poster-17.jpg', alt:'poster 17'},
    {kind:'video', src:'assets/posters/motion-04.mp4'},
    {kind:'video', src:'assets/posters/motion-07.mp4'},
    {kind:'img',   src:'assets/posters/poster-23.jpg', alt:'poster 23'},
    {kind:'video', src:'assets/posters/motion-11.mp4'},
    {kind:'video', src:'assets/posters/motion-06.mp4'},
    {kind:'img',   src:'assets/posters/poster-04.jpg', alt:'poster 4'},
    {kind:'video', src:'assets/posters/motion-01.mp4'},
    {kind:'img',   src:'assets/posters/poster-20.jpg', alt:'poster 20'},
    {kind:'video', src:'assets/posters/motion-13.mp4'},
    {kind:'video', src:'assets/posters/motion-poster-02.mp4'},
    {kind:'video', src:'assets/posters/motion-14.mp4'},
    {kind:'video', src:'assets/posters/motion-15.mp4'}
  ];

  var model = DEFAULT;
  try {
    var raw = localStorage.getItem('posters-order-v1');
    if(raw){ var saved = JSON.parse(raw); if(Array.isArray(saved) && saved.length) model = saved; }
  } catch(e){}

  var grid = document.getElementById('pg-grid');
  model.forEach(function(e){
    var fig = document.createElement('figure'); fig.className = 'pg-cell';
    var m;
    if(e.kind === 'video'){
      m = document.createElement('video');
      m.src = e.src; m.autoplay = true; m.muted = true; m.loop = true;
      m.setAttribute('muted',''); m.setAttribute('playsinline',''); m.setAttribute('aria-hidden','true');
    } else {
      m = document.createElement('img');
      m.src = e.src; m.alt = e.alt || ''; m.loading = 'lazy';
    }
    fig.appendChild(m); grid.appendChild(fig);
  });

  var c = document.getElementById('pg-count');
  if(c) c.textContent = model.length + ' pieces · posters & motion · precise grid';
})();
</script>
</body>
</html>
